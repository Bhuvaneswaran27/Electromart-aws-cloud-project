version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 610213206510.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo Build started...
      - docker build -t electromart .
      - docker tag electromart:latest 610213206510.dkr.ecr.ap-south-1.amazonaws.com/electromart:latest

  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push 610213206510.dkr.ecr.ap-south-1.amazonaws.com/electromart:latest

artifacts:
  files:
    - '**/*'
